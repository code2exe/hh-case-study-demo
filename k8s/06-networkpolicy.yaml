apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hh-hello-api
  namespace: hello-api
spec:
  podSelector:
    matchLabels:
      app: hh-hello-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
