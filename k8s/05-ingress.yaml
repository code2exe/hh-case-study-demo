apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hh-hello-api
  namespace: hello-api
spec:
  ingressClassName: traefik
  rules:
    - host: hello-api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hh-hello-api
                port:
                  number: 80
